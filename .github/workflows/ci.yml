name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # No test script exists yet (see SESSIONS.md) — build is the main
      # regression check for now, same reasoning as becoming-self's CI.
      - run: npm run build
